<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <title>Magilla</title>
  <!-- Original mascot: friendly gorilla with derby, bow tie, and banana. -->
  <circle cx="64" cy="64" r="60" fill="#4A2168"/>
  <circle cx="64" cy="64" r="56" fill="#7B3FA0"/>

  <!-- Ears -->
  <ellipse cx="22" cy="62" rx="14" ry="16" fill="#5C2E86"/>
  <ellipse cx="22" cy="62" rx="8" ry="9" fill="#F3C7A5"/>
  <ellipse cx="106" cy="62" rx="14" ry="16" fill="#5C2E86"/>
  <ellipse cx="106" cy="62" rx="8" ry="9" fill="#F3C7A5"/>

  <!-- Head fur -->
  <ellipse cx="64" cy="70" rx="40" ry="38" fill="#6B3394"/>

  <!-- Derby -->
  <ellipse cx="64" cy="38" rx="34" ry="12" fill="#3A1854"/>
  <rect x="38" y="18" width="52" height="22" rx="16" fill="#4A2168"/>
  <rect x="38" y="28" width="52" height="8" fill="#F4C430"/>
  <ellipse cx="64" cy="20" rx="18" ry="6" fill="#5C2E86"/>

  <!-- Face -->
  <ellipse cx="64" cy="76" rx="28" ry="26" fill="#F3C7A5"/>
  <ellipse cx="64" cy="84" rx="16" ry="12" fill="#E8B48A"/>

  <!-- Eyes -->
  <ellipse cx="52" cy="70" rx="7" ry="8" fill="#1C1524"/>
  <ellipse cx="76" cy="70" rx="7" ry="8" fill="#1C1524"/>
  <circle cx="50" cy="67" r="2.2" fill="#FFFFFF"/>
  <circle cx="74" cy="67" r="2.2" fill="#FFFFFF"/>

  <!-- Brows -->
  <path d="M44 60c6-4 12-4 16 0" stroke="#3A1854" stroke-width="3" stroke-linecap="round"/>
  <path d="M68 60c6-4 12-4 16 0" stroke="#3A1854" stroke-width="3" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M52 90c4 8 20 8 24 0" stroke="#3A1854" stroke-width="3" stroke-linecap="round"/>

  <!-- Bow tie -->
  <path d="M48 108 L64 100 L80 108 L64 116 Z" fill="#F4C430"/>
  <circle cx="64" cy="108" r="5" fill="#E8A0C8"/>

  <!-- Banana accent -->
  <path d="M104 96c10-2 16 8 12 16-8 2-16-6-12-16z" fill="#F4C430"/>
  <path d="M115 97c1-3 3-4 5-4" stroke="#3A1854" stroke-width="2" stroke-linecap="round"/>
</svg>
